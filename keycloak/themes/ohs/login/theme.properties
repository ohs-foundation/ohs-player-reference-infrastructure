parent=keycloak
import=common/keycloak

# Keep the parent (base keycloak) login.css in the chain, then layer our overrides on top.
# Each filename resolves against the theme inheritance chain, so `css/login.css` is the parent's
# base stylesheet and `css/ohs.css` (this theme's) is applied after it.
styles=css/login.css css/ohs.css
