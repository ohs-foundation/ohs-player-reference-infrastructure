# Host nginx vhost for the FHIR Gateway.
#
# Generated by `./dev.sh render` from this template, so change GATEWAY_HOST or FHIR_GATEWAY_PORT in
# .env and re-render rather than editing the output. This is the HOST nginx. The separate nginx
# inside the web image is configured by ../spa.conf.
#
# `./dev.sh nginx` installs this and takes the certificate. Doing it by hand means symlinking the
# rendered nginx/host/gateway.conf into /etc/nginx/sites-enabled/ and running
# `nginx -t && systemctl reload nginx`, but only once the certificate exists — nginx refuses to
# load a vhost whose certificate files are missing.
#
# gateway-ohs-player.example.org must resolve publicly to this server's external IP. Create the shared webroot
# once with `mkdir -p /var/www/certbot`, then take a certificate with
#
#   certbot certonly --webroot -w /var/www/certbot -d gateway-ohs-player.example.org
#
# Who this vhost is for: the Client App and anything else native, which are not bound by CORS,
# plus debugging with curl. The Web Portal does NOT come through here — spa.conf inside the web
# image proxies /fhir and /api/ to the gateway over the compose network, so the browser only ever
# talks to WEB_HOST.
#
# The /api/ block below matters only if a BROWSER client is pointed straight at this subdomain,
# by setting VITE_FHIR_BASE_URL to this host rather than to WEB_HOST. The gateway's own
# interceptor sends CORS headers for /fhir/*, but the plugin's /api/* servlets send none, so they
# are added here and preflight is answered at the edge. Serving the SPA from WEB_HOST avoids it.

server {
    listen 80;
    listen [::]:80;
    server_name gateway-ohs-player.example.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # The http2 parameter here rather than the `http2 on;` directive, which needs nginx 1.25.1
    # and errors with "unknown directive" on anything older.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gateway-ohs-player.example.org;

    ssl_certificate     /etc/letsencrypt/live/gateway-ohs-player.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway-ohs-player.example.org/privkey.pem;

    # Headroom for bulk import payloads.
    client_max_body_size 25m;

    # A large FHIR search can outrun the 60 second default.
    proxy_read_timeout 300s;

    # /fhir/* : the gateway's own CORS interceptor already sends
    # Access-Control-Allow-Origin, so do NOT add it here — it would duplicate.
    location /fhir/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/* : the plugin's servlets send no CORS headers of their own, so add them
    # here for the SPA origin and answer preflight (OPTIONS) at the edge.
    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
            add_header Access-Control-Max-Age       3600 always;
            add_header Content-Length 0;
            add_header Content-Type   text/plain;
            return 204;
        }
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin $http_origin always;
    }

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
