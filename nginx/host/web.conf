# Host nginx vhost for the Web Portal.
#
# Generated by `./dev.sh render` from this template, so change WEB_HOST or OHS_PLAYER_WEB_PORT in
# .env and re-render rather than editing the output. This is the HOST nginx. The separate nginx
# inside the web image, which forwards /fhir and /api/ to the gateway, is configured by ../spa.conf.
#
# `./dev.sh nginx` installs this and takes the certificate. Doing it by hand means symlinking the
# rendered nginx/host/web.conf into /etc/nginx/sites-enabled/ and running
# `nginx -t && systemctl reload nginx`, but only once the certificate exists — nginx refuses to
# load a vhost whose certificate files are missing.
#
# web-ohs-player.example.org must resolve publicly to this server's external IP. Create the shared webroot once
# with `mkdir -p /var/www/certbot`, then take a certificate with
#
#   certbot certonly --webroot -w /var/www/certbot -d web-ohs-player.example.org
#
# The SPA and its backend calls share this one origin. nginx inside the image forwards /fhir and
# /api/ to the gateway container, so the browser issues no cross-origin request and no preflight.
# That is why VITE_FHIR_BASE_URL must name THIS host rather than the gateway one:
#
#   VITE_FHIR_BASE_URL=https://web-ohs-player.example.org/fhir

server {
    listen 80;
    listen [::]:80;
    server_name web-ohs-player.example.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # The http2 parameter here rather than the `http2 on;` directive, which needs nginx 1.25.1
    # and errors with "unknown directive" on anything older.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name web-ohs-player.example.org;

    ssl_certificate     /etc/letsencrypt/live/web-ohs-player.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web-ohs-player.example.org/privkey.pem;

    # Headroom for bulk import payloads, which reach the gateway through this origin.
    client_max_body_size 25m;

    # A large FHIR search can outrun the 60 second default.
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
